[project]
name = "kernel-atlas"
version = "0.1.0"
description = "Index the Linux kernel tree and explore its file structure, symbols, and subsystems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
]

[project.scripts]
kernel-atlas = "kernel_atlas.cli:main"
ka = "kernel_atlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
