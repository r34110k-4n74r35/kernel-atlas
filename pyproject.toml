[project]
name = "kernel-atlas"
dynamic = ["version"]
description = "Index the Linux kernel tree and explore its file structure, symbols, and subsystems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-c>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "build"]

[project.scripts]
kernel-atlas = "kernel_atlas.commands.cli:main"
ka = "kernel_atlas.commands.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "kernel_atlas.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", ".pytest_cache", "indexes", "kernels"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["indexes", "kernels"]
